name: Refresh and publish daily security briefing

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Fetch and sort RSS stories
        run: python scripts/fetch_news.py
      - name: Open or refresh the daily briefing PR
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/daily-security-briefing
          base: main
          delete-branch: true
          add-paths: news.json
          commit-message: "content: refresh daily security briefing"
          title: "Daily security briefing"
          body: |
            Automated daily refresh of the Teklon security, vulnerability, and AI news feed.

            This pull request is merged and published automatically after the feed refresh completes.
      - name: Merge the daily briefing PR
        id: merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAILY_MERGE_TOKEN: ${{ secrets.DAILY_MERGE_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if [[ -n "$DAILY_MERGE_TOKEN" ]]; then
            GH_TOKEN="$DAILY_MERGE_TOKEN" gh pr merge "$PR_NUMBER" --squash --delete-branch --admin
          elif ! gh pr merge "$PR_NUMBER" --squash --delete-branch; then
            echo "The main ruleset blocked automatic merging. The PR remains open for the existing approval workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - name: Check out the updated main branch
        if: steps.merge.outputs.merged == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure GitHub Pages
        if: steps.merge.outputs.merged == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Package the automatic edition
        if: steps.merge.outputs.merged == 'true'
        run: >-
          tar --dereference --hard-dereference --directory .
          -cf "$RUNNER_TEMP/artifact.tar"
          --exclude=.git --exclude=.github .
      - name: Upload the website artifact
        if: steps.merge.outputs.merged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Publish the updated edition
        if: steps.merge.outputs.merged == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
