name: Refresh daily security briefing

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  refresh-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Fetch and sort RSS stories
        run: python scripts/fetch_news.py
      - name: Open or refresh the daily briefing PR
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/daily-security-briefing
          base: main
          delete-branch: true
          add-paths: |
            news.json
            videos.json
          commit-message: "content: refresh daily security briefing and videos"
          title: "Daily security briefing"
          body: |
            Automated daily refresh of the Teklon security, vulnerability, and AI news feed, plus recent videos from curated channels.

            This pull request is merged and published automatically after the feed refresh completes.
      - name: Merge the daily briefing PR
        id: merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAILY_MERGE_TOKEN: ${{ secrets.DAILY_MERGE_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if [[ -n "$DAILY_MERGE_TOKEN" ]]; then
            GH_TOKEN="$DAILY_MERGE_TOKEN" gh pr merge "$PR_NUMBER" --squash --delete-branch --admin
          else
            if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
              echo "default-token-merged=true" >> "$GITHUB_OUTPUT"
            else
              echo "The main ruleset blocked automatic merging. The PR remains open for the existing approval workflow." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
      - name: Start Pages deployment for a GITHUB_TOKEN merge
        if: steps.merge.outputs.default-token-merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
