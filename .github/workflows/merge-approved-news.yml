name: Merge approved briefing and publish

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: approved-daily-briefing
  cancel-in-progress: false

jobs:
  merge-and-publish:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'automation/daily-security-briefing'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the reviewed edition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
      - name: Check out the updated main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Package the approved website
        run: >-
          tar --dereference --hard-dereference --directory .
          -cf "$RUNNER_TEMP/artifact.tar"
          --exclude=.git --exclude=.github .
      - name: Upload the approved website artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Publish the approved edition
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
