name: Retry failed daily briefing and Pages runs

on:
  workflow_run:
    workflows:
      - Refresh daily security briefing
      - Publish Teklon website
      - Merge approved briefing and publish
    types:
      - completed

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (
        github.event.workflow_run.head_branch == 'main' ||
        (
          github.event.workflow_run.name == 'Merge approved briefing and publish' &&
          github.event.workflow_run.head_branch == 'automation/daily-security-briefing'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Wait before retrying
        id: retry_check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          ATTEMPT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .run_attempt)"
          if (( ATTEMPT >= 3 )); then
            echo "This run has already used all three attempts; no further retries will be started." >> "$GITHUB_STEP_SUMMARY"
            echo "can_retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "can_retry=true" >> "$GITHUB_OUTPUT"
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "Retrying failed jobs after attempt ${ATTEMPT} of 3." >> "$GITHUB_STEP_SUMMARY"
          sleep $((ATTEMPT * 30))
      - name: Retry failed jobs
        if: steps.retry_check.outputs.can_retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ steps.retry_check.outputs.attempt }}
        run: |
          gh api --method POST --silent "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "Requested retry for failed jobs (attempt ${ATTEMPT} of 3)." >> "$GITHUB_STEP_SUMMARY"
